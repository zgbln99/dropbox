services:
  jrjr-drive:
    build: .
    image: jrjr-drive
    container_name: jrjr-drive
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Host port 3001 -> container port 3000. Bind to localhost only; nginx
      # terminates TLS and proxies to this. Host 3000 is used by another
      # service, so the portal is exposed on 3001.
      - "127.0.0.1:3001:3000"
    volumes:
      # Persist the SQLite database and cached previews across restarts.
      - ./data:/app/data
    # Memory ceiling. PSD previews decode the whole document in memory, so a
    # generous limit is needed for large files. Lower this if the VPS has
    # little RAM (a small PSD still works at 512m).
    mem_limit: 2g
